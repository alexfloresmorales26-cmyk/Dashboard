<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tablero - Tareas, Notas Markdown y Metas Diarias">
  <meta name="theme-color" content="#fafafa">
  <title>Tablero</title>
  <script>
    /* Guardián de versión: el HTML llega siempre fresco (network-first), así
       que este script corre antes que los assets. Si hay una versión nueva y
       un SW viejo controlando la página, desregistra el SW, borra las cachés y
       recarga una vez para servir todo actualizado. Evita quedarse pegado a
       versiones viejas cacheadas por el Service Worker. */
    (function () {
      var APP_VERSION = '3'; // bump junto con CACHE_NAME de sw.js
      try {
        if (localStorage.getItem('app-version') === APP_VERSION) return;
        localStorage.setItem('app-version', APP_VERSION);
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            var hadSW = regs.length > 0;
            var ops = regs.map(function (reg) { return reg.unregister(); });
            if ('caches' in window) {
              ops = ops.concat(caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key); }));
              }));
            }
            Promise.all(ops).then(function () {
              if (hadSW) location.reload();
            });
          });
        }
      } catch (e) { /* noop */ }
    })();
  </script>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="/src/styles/variables.css">
  <link rel="stylesheet" href="/src/styles/reset.css">
  <link rel="stylesheet" href="/src/styles/layout.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/navigation.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Barra lateral (desktop) -->
    <aside id="sidebar" class="nav-sidebar" role="navigation" aria-label="Navegación principal"></aside>

    <!-- Vistas -->
    <main id="main" role="main"></main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
